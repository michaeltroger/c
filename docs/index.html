            var supported = ["en","de","es","fr","hr","it","pt","ru","sr","uk","be","bg","mk"];
            var pick = null;
            try {
                var stored = localStorage.getItem("preferredLocale");
                if (stored && supported.indexOf(stored) !== -1) pick = stored;

            if (!pick) {
                var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"];

                    var code = String(langs[i]).toLowerCase().split("-")[0];
                    if (supported.indexOf(code) !== -1) pick = code;
                }
            }
            location.replace("/" + (pick || "en") + "/" + location.search + location.hash);
        })();
    </script>
